[project]
name = "py-rest-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fkhan", email = "fkhan@fortecmedical.com" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.3",
    "flask>=3.1.3",
    "flask-smorest>=0.45.0",
    "sqlalchemy>=2.0.53",
    "flask-sqlalchemy>=3.1.1",
    "flask-jwt-extended>=4.7.4",
    "flask-migrate>=4.1.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.2.0",
    "requests>=2.34.2",
    "rq>=2.12.0",
    "jinja2>=3.1.6",
]

[project.scripts]
py-rest-api = "py_rest_api:main"
py-rest-api-worker = "py_rest_api.worker:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
